services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_DB: recipes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only for `pnpm test`, and only while a test run needs it. Naming it on the
  # command line starts it despite the profile, so this is the whole command:
  #   docker compose up -d --wait postgres-test
  # Its own port and database, so a test run cannot reach the development data,
  # and its data is on tmpfs, so stopping the container throws it away.
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
      POSTGRES_DB: recipes_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt in with: docker compose --profile app up
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Set here rather than in .env.local, because the database is a sibling
      # container rather than localhost. Next leaves existing variables alone.
      DATABASE_URL: postgresql://recipes:recipes@postgres:5432/recipes
    ports:
      - "3100:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  node-modules:
  next-cache:
